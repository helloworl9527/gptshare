openapi: 3.0.3
info:
  title: ChatGPT Monitor API
  version: 0.7.0
  description: STEP-07 API contract. Authentication uses same-origin Secure cookies; credentials, OAuth PKCE verifiers/codes, OAuth device codes, channel secrets, and raw upstream evidence are never returned. Notification channels are configuration-only and remain disconnected.
  license:
    name: Proprietary
servers:
  - url: https://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report service and database health
      security: []
      responses:
        '200':
          description: Service and database are healthy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Service is running but its database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/csrf:
    get:
      operationId: issueCSRF
      summary: Issue or rotate the double-submit CSRF token
      security: []
      responses:
        '200':
          description: CSRF token issued in JSON and a Secure SameSite cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/password:
    post:
      operationId: verifyPassword
      summary: Verify the administrator password and issue a one-time TOTP challenge
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '200':
          description: Password accepted; opaque challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/totp:
    post:
      operationId: verifyTOTP
      summary: Consume a one-time challenge and establish the administrator session
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPRequest'
      responses:
        '204':
          description: Two factors accepted; session and rotated CSRF cookies set, with no JWT response body
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current server-side session and clear cookies
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked; session and CSRF cookies cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      operationId: getCurrentAdministrator
      summary: Return the authenticated administrator identity
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts:
    get:
      operationId: listAccounts
      summary: List active monitored accounts without credential material
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active accounts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    get:
      operationId: getAccount
      summary: Get one active account without credential material
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAccount
      summary: Tombstone an account and irreversibly clear stored credentials
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Account removed, including when it was already absent or removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}/ban:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: banAccount
      summary: Atomically mark an account banned and queue its allocation snapshot
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Account is banned; repeated requests are idempotent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBanResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}/sync-allocation:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: retryAccountAllocationSync
      summary: Queue the latest credential-free account snapshot for allocation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Latest account snapshot queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/internal/v1/monitor-account-events:
    post:
      operationId: applyMonitorAccountEvent
      summary: Idempotently apply a credential-free monitor account event
      security:
        - accountEventBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorAccountEvent'
      responses:
        '200':
          description: Event applied, recognized as duplicate, or ignored as stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorAccountEventResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/import/token:
    post:
      operationId: importAccountByToken
      summary: Validate and atomically import one account from a direct credential
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenImportRequest'
      responses:
        '201':
          description: Account imported and authorization expiry snapshotted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/import/token/batch:
    post:
      operationId: importAccountsByTokenBatch
      summary: Independently validate and import up to 50 direct credentials with at most three workers
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTokenImportRequest'
      responses:
        '200':
          description: Per-item results; successful imports are not rolled back when another item fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTokenImportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}/reauthorize/token:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: reauthorizeAccountByToken
      summary: Replace credentials and atomically open a new authorization epoch
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenImportRequest'
      responses:
        '200':
          description: Account reauthorized; earlier authorization epochs remain auditable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/import/oauth/start:
    post:
      operationId: startOAuthImport
      summary: Start a 15-minute Codex CLI PKCE authorization for a new account
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStartRequest'
      responses:
        '201':
          description: Encrypted OAuth session created; state appears only inside the standard authorization URL and the verifier is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}/reauthorize/oauth/start:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: startOAuthReauthorization
      summary: Start a 15-minute Codex CLI PKCE authorization for an existing account
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Encrypted OAuth reauthorization session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/oauth/{oauthSessionId}/complete:
    parameters:
      - $ref: '#/components/parameters/OAuthSessionID'
    post:
      operationId: completeOAuthAuthorization
      summary: Validate a manually pasted localhost callback and atomically consume its PKCE session
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCompleteRequest'
      responses:
        '200':
          description: OAuth code exchanged and account imported or reauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/import/device/start:
    post:
      operationId: startDeviceImport
      summary: Start a persisted OAuth device authorization for a new account
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStartRequest'
      responses:
        '201':
          description: Device authorization created; device_code is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}/reauthorize/device/start:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: startDeviceReauthorization
      summary: Start a persisted OAuth device authorization for an existing account
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Device reauthorization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/import/device/{deviceSessionId}/poll:
    parameters:
      - $ref: '#/components/parameters/DeviceSessionID'
    post:
      operationId: pollDeviceImport
      summary: Poll one persisted device authorization without bypassing its upstream interval
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Pending, slowed, expired, or idempotently authorized state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePollResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/accounts/{accountId}/refresh:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      operationId: refreshAccountNow
      summary: Idempotently start one real-time account refresh
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Refresh completed within 20 seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollRun'
        '202':
          description: Refresh continues asynchronously and can be queried by run id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Refresh is already running or polling is paused; an authorization warning returns code reauthorization_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/poll-runs/{pollRunId}:
    parameters:
      - $ref: '#/components/parameters/PollRunID'
    get:
      operationId: getPollRun
      summary: Read the persisted state and aggregate counts of one poll run
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Poll run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/settings:
    get:
      operationId: getSettings
      summary: Read whitelisted operational settings and disconnected channel slots
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Settings returned without secrets or internal registry keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateSettings
      summary: Update whitelisted settings; notification channels remain disconnected
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Settings updated; secrets are represented only by configured flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/settings/channels/{channel}/secret:
    delete:
      operationId: clearChannelSecret
      summary: Idempotently clear a write-only channel secret and record an audit entry
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRFToken'
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [telegram, wecom, feishu]
      responses:
        '204':
          description: Secret is absent; the idempotent action was audited
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/monitor/accounts:
    get:
      operationId: listAllocationMonitorAccounts
      summary: List monitor-owned accounts for allocation-service pull synchronization
      security:
        - allocationServiceBearer: []
      responses:
        '200':
          description: Read-only monitor account list without credential material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationAccountListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/monitor/accounts/import-for-allocation:
    post:
      operationId: importAccountForAllocation
      summary: Import one credential for allocation-service monitoring ownership
      security:
        - allocationServiceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationImportRequest'
      responses:
        '201':
          description: Account imported by the monitor service without returning credential material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationAccountStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/monitor/accounts/batch-status:
    post:
      operationId: getAllocationBatchStatus
      summary: Return item-level monitor status for 1-100 provider account ids
      security:
        - allocationServiceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationBatchStatusRequest'
      responses:
        '200':
          description: Batch status with item-level not_found errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationBatchStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/monitor/accounts/{providerAccountId}/status:
    parameters:
      - $ref: '#/components/parameters/ProviderAccountID'
    get:
      operationId: getAllocationAccountStatus
      summary: Return monitor status for one provider account id
      security:
        - allocationServiceBearer: []
      responses:
        '200':
          description: Account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationAccountStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-session
    allocationServiceBearer:
      type: http
      scheme: bearer
    accountEventBearer:
      type: http
      scheme: bearer
  headers:
    RequestID:
      schema:
        type: string
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
    AccountID:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DeviceSessionID:
      name: deviceSessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    OAuthSessionID:
      name: oauthSessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    PollRunID:
      name: pollRunId
      in: path
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ProviderAccountID:
      name: providerAccountId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: Credentials, challenge, or TOTP are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: A valid, non-revoked session is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CSRFRejected:
      description: Same-origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Account, client IP, or global authentication limit reached
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The active account does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The provider account is already active
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Content-Type must be application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: The upstream credential provider returned a retryable failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Request could not be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, db, request_id]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: boolean
        request_id:
          type: string
          minLength: 1
    CSRFResponse:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 32
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge, expires_in]
      properties:
        challenge:
          type: string
          minLength: 32
        expires_in:
          type: integer
          enum: [120]
    TOTPRequest:
      type: object
      additionalProperties: false
      required: [challenge, code]
      properties:
        challenge:
          type: string
          minLength: 32
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
    MeResponse:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
    TokenImportRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 256
        access_token:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        refresh_token:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        session_token:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
      anyOf:
        - required: [access_token]
        - required: [refresh_token]
        - required: [session_token]
    BatchTokenImportRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/BatchTokenImportItem'
    BatchTokenImportItem:
      allOf:
        - $ref: '#/components/schemas/TokenImportRequest'
        - oneOf:
            - required: [access_token]
            - required: [refresh_token]
            - required: [session_token]
    BatchTokenImportResponse:
      type: object
      additionalProperties: false
      required: [total, succeeded, failed, results]
      properties:
        total:
          type: integer
          minimum: 1
          maximum: 50
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        results:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BatchTokenImportItemResult'
    BatchTokenImportItemResult:
      type: object
      additionalProperties: false
      required: [index, status]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 49
        status:
          type: string
          enum: [success, duplicate, invalid, upstream_unavailable, failed]
        code:
          type: string
        account:
          $ref: '#/components/schemas/Account'
    OAuthStartRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 256
    OAuthStartResponse:
      type: object
      additionalProperties: false
      required: [session_id, authorization_url, expires_at]
      properties:
        session_id:
          type: string
          minLength: 32
          maxLength: 128
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    OAuthCompleteRequest:
      type: object
      additionalProperties: false
      required: [callback_url]
      properties:
        callback_url:
          type: string
          format: uri
          maxLength: 8192
          writeOnly: true
    AllocationImportRequest:
      type: object
      additionalProperties: false
      required: [token, token_type]
      properties:
        label:
          type: string
          maxLength: 256
        token:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
        token_type:
          type: string
          enum: [access_token, refresh_token, session_token, access, refresh, session]
    AllocationBatchStatusRequest:
      type: object
      additionalProperties: false
      required: [provider_account_ids]
      properties:
        provider_account_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 256
    AllocationAccountStatus:
      type: object
      additionalProperties: false
      required: [provider_account_id, status, plan, auth_expiry, subscription_expiry, checked_at]
      properties:
        provider_account_id:
          type: string
          minLength: 1
          readOnly: true
        email:
          type: string
          format: email
          nullable: true
          readOnly: true
        status:
          type: string
          enum: [alive, dead_normal, dead_banned]
          readOnly: true
        plan:
          type: string
          enum: [free, plus, team, unknown]
          readOnly: true
        auth_expiry:
          type: string
          format: date-time
          readOnly: true
        subscription_expiry:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        checked_at:
          type: string
          format: date-time
          readOnly: true
    AllocationAccountListResponse:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AllocationAccountListItem'
        request_id:
          type: string
          readOnly: true
    AllocationAccountListItem:
      type: object
      additionalProperties: false
      required: [provider_account_id, status, plan, auth_expiry]
      properties:
        provider_account_id:
          type: string
          minLength: 1
          readOnly: true
        email:
          type: string
          format: email
          nullable: true
          readOnly: true
        status:
          type: string
          enum: [alive, dead_normal, dead_banned]
          readOnly: true
        plan:
          type: string
          enum: [free, plus, team, unknown]
          readOnly: true
        auth_expiry:
          type: string
          format: date-time
          readOnly: true
    AllocationBatchStatusResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AllocationBatchStatusItem'
    AllocationBatchStatusItem:
      type: object
      additionalProperties: false
      required: [provider_account_id]
      properties:
        provider_account_id:
          type: string
          minLength: 1
        status:
          type: string
          enum: [alive, dead_normal, dead_banned]
        plan:
          type: string
          enum: [free, plus, team, unknown]
        subscription_expiry:
          type: string
          format: date-time
          nullable: true
        checked_at:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/AllocationItemError'
    AllocationItemError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [not_found, validation_failed]
        message:
          type: string
    CredentialSummary:
      type: object
      additionalProperties: false
      required: [type, configured]
      properties:
        type:
          type: string
          enum: [access, refresh, session, device]
        configured:
          type: boolean
    Account:
      type: object
      additionalProperties: false
      required: [id, provider_account_id, email, label, plan, current_expiry, auth_expiry, status, last_check_state, near_expiry, polling_paused, last_authorized_at, credential, allocation_sync]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        provider_account_id:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
          readOnly: true
        label:
          type: string
          maxLength: 256
        plan:
          type: string
          enum: [free, plus, team]
        current_expiry:
          type: string
          format: date-time
          nullable: true
        auth_expiry:
          type: string
          format: date-time
        status:
          type: string
          enum: [alive, dead_normal, dead_banned]
        last_alive_at:
          type: string
          format: date-time
        dead_at:
          type: string
          format: date-time
        death_type:
          type: string
          enum: [normal_expiry, abnormal_ban]
        banned_survival_days:
          type: number
          format: double
          minimum: 0
        last_check_state:
          type: string
          enum: [pending, ok, error, verification_required, contract_changed, reauthorization_required]
        last_check_error_code:
          type: string
          description: Stable sanitized monitor error code; OAuth authorization failures use the oauth_* codes and never include upstream response text or credential material
        next_retry_at:
          type: string
          format: date-time
        near_expiry:
          type: boolean
        polling_paused:
          type: boolean
        last_authorized_at:
          type: string
          format: date-time
        credential:
          $ref: '#/components/schemas/CredentialSummary'
        allocation_sync:
          $ref: '#/components/schemas/AllocationSyncStatus'
    AllocationSyncStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, processing, retrying, delivered, failed]
        event_id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        error_code:
          type: string
    AccountBanResult:
      type: object
      additionalProperties: false
      required: [account, already_banned]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        already_banned:
          type: boolean
    MonitorAccountEvent:
      type: object
      additionalProperties: false
      required: [event_id, version, event_type, occurred_at, provider_account_id, plan, subscription_expiry, status]
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: integer
          format: int64
          minimum: 1
        event_type:
          type: string
          enum: [account.created, account.updated, account.dead_banned, account.reauthorized]
        occurred_at:
          type: string
          format: date-time
        provider_account_id:
          type: string
          minLength: 1
          maxLength: 512
        email:
          type: string
          format: email
        plan:
          type: string
          enum: [free, plus, team, unknown]
        subscription_expiry:
          type: string
          format: date-time
        status:
          type: string
          enum: [alive, dead_normal, dead_banned]
    MonitorAccountEventResult:
      type: object
      additionalProperties: false
      required: [disposition, created, updated, migrated, pending]
      properties:
        disposition:
          type: string
          enum: [applied, duplicate, stale]
        created:
          type: boolean
        updated:
          type: boolean
        migrated:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
    DeviceStartRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 256
    DeviceStartResponse:
      type: object
      additionalProperties: false
      required: [session_id, user_code, verify_url, interval_seconds, expires_at, state]
      properties:
        session_id:
          type: string
          minLength: 32
          maxLength: 128
        user_code:
          type: string
          minLength: 1
        verify_url:
          type: string
          format: uri
        interval_seconds:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [pending]
    DevicePollResponse:
      type: object
      additionalProperties: false
      required: [session_id, state]
      properties:
        session_id:
          type: string
          minLength: 32
          maxLength: 128
        state:
          type: string
          enum: [pending, slow_down, expired, authorized]
        retry_after_seconds:
          type: integer
          minimum: 1
        restart_required:
          type: boolean
        account:
          $ref: '#/components/schemas/Account'
    PollRun:
      type: object
      additionalProperties: false
      required: [id, state, trigger, started_at, accounts_total, accounts_ok, accounts_failed, accounts_skipped, error_counts]
      properties:
        id:
          type: string
          minLength: 16
        state:
          type: string
          enum: [running, completed, failed, cancelled, skipped, interrupted]
        trigger:
          type: string
          enum: [scheduled, manual]
        account_id:
          type: integer
          format: int64
          minimum: 1
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        accounts_total:
          type: integer
          minimum: 0
        accounts_ok:
          type: integer
          minimum: 0
        accounts_failed:
          type: integer
          minimum: 0
        accounts_skipped:
          type: integer
          minimum: 0
        error_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        error_code:
          type: string
    ChannelState:
      type: object
      additionalProperties: false
      required: [enabled, configured, connected]
      properties:
        enabled:
          type: boolean
          enum: [false]
          description: Always false in phase one.
        configured:
          type: boolean
        connected:
          type: boolean
          enum: [false]
          description: No real channel adapter is connected in phase one.
    ChannelUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          enum: [false]
        secret:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Empty or omitted values do not overwrite an existing secret.
    Settings:
      type: object
      additionalProperties: false
      required: [poll_interval, near_expiry_days, channels]
      properties:
        poll_interval:
          type: integer
          minimum: 900
          maximum: 86400
        near_expiry_days:
          type: integer
          minimum: 1
          maximum: 30
        channels:
          type: object
          additionalProperties: false
          required: [telegram, wecom, feishu]
          properties:
            telegram:
              $ref: '#/components/schemas/ChannelState'
            wecom:
              $ref: '#/components/schemas/ChannelState'
            feishu:
              $ref: '#/components/schemas/ChannelState'
    SettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        poll_interval:
          type: integer
          minimum: 900
          maximum: 86400
        near_expiry_days:
          type: integer
          minimum: 1
          maximum: 30
        channels:
          type: object
          additionalProperties: false
          properties:
            telegram:
              $ref: '#/components/schemas/ChannelUpdate'
            wecom:
              $ref: '#/components/schemas/ChannelUpdate'
            feishu:
              $ref: '#/components/schemas/ChannelUpdate'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
        request_id:
          type: string
        run_id:
          type: string
