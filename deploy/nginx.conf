worker_processes auto;
pid __PID_PATH__;
error_log __ERROR_LOG__ warn;

events { worker_connections 1024; }

http {
    include __MIME_TYPES__;
    default_type application/octet-stream;
    server_tokens off;
    access_log __ACCESS_LOG__;

    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    client_max_body_size 64k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    keepalive_timeout 30s;
    send_timeout 30s;

    map $http_upgrade $connection_upgrade {
        default close;
    }

    server {
        listen 127.0.0.1:__HTTP_PORT__;
        server_name __SERVER_NAME__;
        return 308 https://$host:__HTTPS_PORT__$request_uri;
    }

    server {
        listen 127.0.0.1:__HTTPS_PORT__ ssl;
        http2 on;
        server_name __SERVER_NAME__;

        ssl_certificate __TLS_CERT__;
        ssl_certificate_key __TLS_KEY__;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        root __WEB_ROOT__;
        index index.html;

        include __SECURITY_HEADERS__;

        location = /api/auth/password {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://127.0.0.1:8080;
            include __PROXY_PARAMS__;
            include __SECURITY_HEADERS__;
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://127.0.0.1:8080;
            include __PROXY_PARAMS__;
            include __SECURITY_HEADERS__;
            add_header Cache-Control "no-store" always;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8080;
            include __PROXY_PARAMS__;
            include __SECURITY_HEADERS__;
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            try_files $uri =404;
            include __SECURITY_HEADERS__;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ~ ^/(bin|migrations|deploy|scripts)/ { return 404; }

        location / {
            try_files $uri $uri/ /index.html;
            include __SECURITY_HEADERS__;
            add_header Cache-Control "no-store" always;
        }

        location ~ /\. { deny all; }
    }
}
