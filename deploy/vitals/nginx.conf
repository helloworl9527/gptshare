worker_processes 1;
pid __PID_PATH__;
error_log __ERROR_LOG__ warn;
events { worker_connections 256; }
http {
    access_log off;
    upstream vitals_unified { server 127.0.0.1:8080; }
    server {
        listen 127.0.0.1:9443 ssl;
        http2 on;
        server_name vitals.localhost;
        ssl_certificate __TLS_CERT__;
        ssl_certificate_key __TLS_KEY__;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location / {
            proxy_pass http://vitals_unified;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 30s;
        }
    }
}
