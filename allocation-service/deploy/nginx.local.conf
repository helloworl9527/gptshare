# Local loopback reverse proxy template for phase-one monitor and allocation-service.
# Production hostnames, certificates, and upload require separate user approval.

upstream phase_one_monitor {
    server 127.0.0.1:8080;
}

upstream allocation_service {
    server 127.0.0.1:9090;
}

server {
    listen 127.0.0.1:9443 ssl;
    http2 on;
    server_name phase1.localhost 127.0.0.1;

    ssl_certificate /etc/ssl/local/phase-one-monitor.crt;
    ssl_certificate_key /etc/ssl/local/phase-one-monitor.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://phase_one_monitor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}

server {
    listen 127.0.0.1:9444 ssl;
    http2 on;
    server_name allocation.localhost;

    ssl_certificate /etc/ssl/local/allocation-service.crt;
    ssl_certificate_key /etc/ssl/local/allocation-service.key;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://allocation_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
